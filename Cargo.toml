[package]
name = "alembic_client"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.15"
chrono = "0.4"
dirs = "5"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
ureq = { version = "2", features = ["json"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
